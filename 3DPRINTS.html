<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waters 3D PRINTS</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a, #111);
            font-family: "Segoe UI", Arial, sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 60px;
            border-radius: 18px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.3);
            animation: pop 0.8s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px #009dff;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #009dff;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 15px #009dff;
            transition: 0.25s ease;
            margin: 10px;
        }

        .btn:hover {
            background: #00b7ff;
            box-shadow: 0 0 25px #00b7ff;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Waters 3D PRINTS</h1>
        <p>Waters 3D PRINTS is currently unavailable and has not been created yet.</p>
        <p>Please visit the Ayo Hacking 3D Print Store instead.</p>

        <a class="btn" href="https://ayohacking.com/3DPRINT/home.html">
            Go to Ayo Hacking 3D Print Store
        </a>

        <a class="btn" href="https://thefamilywaters.com">
            Continue Back to Main Website
        </a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    overflow:hidden;
    position:relative;
}

/* Background blobs */
.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
}

.blob-1{
    width:350px;
    height:350px;
    background:#3b82f6;
    top:-100px;
    left:-100px;
}

.blob-2{
    width:400px;
    height:400px;
    background:#8b5cf6;
    bottom:-150px;
    right:-100px;
}

/* Card */
.container{
    width:90%;
    max-width:650px;
    text-align:center;
    padding:60px 50px;

    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.08);
    border-radius:28px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

/* Badge */
.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:999px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);

    color:#94a3b8;
    font-size:.85rem;
    margin-bottom:24px;
}

.error{
    font-size:7rem;
    font-weight:800;
    line-height:1;

    background:linear-gradient(
        135deg,
        #ffffff,
        #94a3b8
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

h1{
    color:white;
    margin-top:12px;
    font-size:2rem;
    font-weight:700;
}

p{
    color:#94a3b8;
    margin-top:18px;
    line-height:1.8;
    font-size:1rem;
}

.actions{
    margin-top:35px;
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:14px 24px;
    border-radius:14px;
    font-weight:600;
    transition:.25s ease;
}

.primary{
    background:white;
    color:#0f172a;
}

.primary:hover{
    transform:translateY(-2px);
}

.secondary{
    background:rgba(255,255,255,.05);
    color:white;
    border:1px solid rgba(255,255,255,.1);
}

.secondary:hover{
    background:rgba(255,255,255,.08);
}

.footer{
    margin-top:30px;
    color:#64748b;
    font-size:.9rem;
}

@media(max-width:600px){

    .container{
        padding:40px 28px;
    }

    .error{
        font-size:5rem;
    }

    h1{
        font-size:1.6rem;
    }
}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">

    <div class="badge">
        Error 404
    </div>

    <div class="error">404</div>

    <h1>Page not found</h1>

    <p>
        The page you're looking for doesn't exist or may have
        been moved. Try returning to the homepage or checking
        the URL.
    </p>

    <div class="actions">
        <a href="/" class="btn primary">
            Go Home
        </a>

        <a href="javascript:history.back()"
           class="btn secondary">
            Go Back
        </a>
    </div>

    <div class="footer">
        © 2026 Your Company
    </div>

</div>

</body>
</html>
